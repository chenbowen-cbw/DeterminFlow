[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "determinflow"
version = "0.1.0"
description = "Deterministic workflow runtime for production AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["ai", "workflow", "llm", "agent", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "openai==2.44.0",
  "mcp==1.28.1",
  "python-dotenv==1.2.2",
  "rich==15.0.0",
  "langgraph==1.2.8",
  "langchain-core==1.4.8",
  "langchain-openai==1.3.3",
  "fastapi==0.139.0",
  "uvicorn[standard]==0.50.2",
  "websockets==15.0.1",
  "watchdog==6.0.0",
  "croniter==6.2.3",
  "aiofiles==25.1.0",
  "gunicorn==26.0.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.toml", "*.json", "*.md", "*.sql", "*.tsx", "*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.vercel]
entrypoint = "src.web_server:app"
